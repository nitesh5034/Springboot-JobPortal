server.port=8080
spring.thymeleaf.enabled=false
spring.thymeleaf.check-template-location=false

spring.mvc.view.prefix=/admin/
spring.mvc.view.suffix=.jsp
# Database Connection String
# 1. Database Connection URL Parameter (Explicit Native Plugin Hook Override)
spring.datasource.url=jdbc:mysql://localhost:3306/JobPortal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 2. Server Authentication Identity Check
spring.datasource.username=root
spring.datasource.password=1234

# 3. Explicit modern driver identification string
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10

# Force Override Dialect (Spring Boot standard + Core Hibernate level)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Native Schema Control
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

